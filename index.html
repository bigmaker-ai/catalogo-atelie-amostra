<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catálogo · Ateliê America Ribeiro</title>
<meta name="description" content="Catálogo de vestidos do Ateliê America Ribeiro: 15 anos, festa, casamento e mais.">
<meta property="og:title" content="Catálogo · Ateliê America Ribeiro">
<meta property="og:description" content="Veja os vestidos e chame no WhatsApp.">
<meta property="og:image" content="https://bigmaker-ai.github.io/catalogo-atelie-amostra/media/rose-floral-og.jpg">
<meta name="theme-color" content="#f6efea">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6efea;
    --ink: #3b2a2a;
    --muted: #8a7270;
    --rose: #9a5559;
    --gold: #b8976a;
    --line: #e6d8d0;
    --zap: #1faa59;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Jost", system-ui, sans-serif;
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }

  header { text-align: center; padding: 20px 16px 10px; }
  .brand-small { font-size: 10px; letter-spacing: .35em; text-transform: uppercase; color: var(--gold); }
  .brand { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; font-size: 28px; line-height: 1.1; }

  /* Categorias */
  nav {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    display: flex; gap: 8px;
    overflow-x: auto; scrollbar-width: none;
    padding: 10px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  nav::-webkit-scrollbar { display: none; }
  .chip {
    flex: none;
    padding: 8px 16px;
    border-radius: 99px;
    border: 1px solid var(--line);
    background: #fbf7f4;
    font-size: 14px;
    white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

  /* Grade */
  .grid {
    max-width: 1100px; margin: 0 auto;
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 18px 12px;
    padding: 16px 16px 40px;
  }
  @media (min-width: 700px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 26px 18px; } }
  .card { text-align: left; display: grid; gap: 7px; }
  .card .pic { position: relative; aspect-ratio: 3 / 4; border-radius: 12px; overflow: hidden; background: #eadfd8; }
  .card img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; display: block; transition: transform .4s; }
  .card:hover img { transform: scale(1.03); }
  .card .play {
    position: absolute; right: 8px; bottom: 8px;
    width: 28px; height: 28px; border-radius: 50%;
    background: rgba(255, 255, 255, .85);
    display: grid; place-items: center;
  }
  .card .play::after { content: ""; border-left: 9px solid var(--ink); border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 2px; }
  .card b { font-weight: 400; font-size: 15px; }
  .card small { color: var(--muted); font-size: 12px; }
  .empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }

  /* Visualizador */
  .viewer {
    position: fixed; inset: 0; z-index: 10;
    background: #120c0c;
    display: none; flex-direction: column;
  }
  .viewer.open { display: flex; }
  .slides {
    flex: 1; min-height: 0;
    display: flex; overflow-x: auto;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  .slides::-webkit-scrollbar { display: none; }
  .slide { flex: none; width: 100%; height: 100%; scroll-snap-align: center; display: grid; place-items: center; }
  .slide img, .slide video { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
  .close {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(0, 0, 0, .45); color: #fff; font-size: 22px; line-height: 1;
  }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 44px; height: 44px; border-radius: 50%;
    background: rgba(0, 0, 0, .35); color: #fff; font-size: 22px;
    display: none;
  }
  @media (hover: hover) { .arrow { display: block; } }
  .arrow.prev { left: 14px; }
  .arrow.next { right: 14px; }
  .dots { display: flex; justify-content: center; gap: 6px; padding: 10px 0 0; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, .3); transition: background .2s; }
  .dots span.on { background: #fff; }
  .bar {
    color: #fff;
    padding: 12px 16px calc(16px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 14px;
    max-width: 600px; width: 100%; margin: 0 auto;
  }
  .bar .name { flex: 1; min-width: 0; }
  .bar .name b { display: block; font-family: "Cormorant Garamond", serif; font-weight: 500; font-size: 22px; line-height: 1.1; }
  .bar .name small { color: rgba(255, 255, 255, .6); font-size: 12px; }
  .zap {
    flex: none;
    display: flex; align-items: center; gap: 8px;
    background: var(--zap); color: #fff; text-decoration: none;
    padding: 13px 18px; border-radius: 99px;
    font-size: 15px; font-weight: 500;
  }
  .zap svg { width: 20px; height: 20px; fill: currentColor; }
</style>
</head>
<body>

<header>
  <div class="brand-small">Ateliê</div>
  <div class="brand">America Ribeiro</div>
</header>

<nav id="cats" aria-label="Categorias"></nav>
<main class="grid" id="grid"></main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true">
  <button class="close" id="close" aria-label="Fechar">×</button>
  <button class="arrow prev" id="prev" aria-label="Anterior">‹</button>
  <button class="arrow next" id="next" aria-label="Próxima">›</button>
  <div class="slides" id="slides"></div>
  <div class="dots" id="dots"></div>
  <div class="bar">
    <div class="name"><b id="vName"></b><small id="vInfo"></small></div>
    <a class="zap" id="zap" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.9 11.9 0 0 0 4.6 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3z"/></svg>
      Quero este
    </a>
  </div>
</div>

<script src="vestidos.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const isVideo = src => src.endsWith('.mp4');
  let filtro = 'Todos';

  // Categorias
  function renderCats() {
    const nomes = ['Todos', ...CATEGORIAS];
    $('cats').innerHTML = nomes.map(c =>
      `<button class="chip" aria-pressed="${c === filtro}">${c}</button>`).join('');
    $('cats').querySelectorAll('.chip').forEach((b, i) =>
      b.onclick = () => { filtro = nomes[i]; renderCats(); renderGrid(); });
  }

  // Grade de vestidos
  function renderGrid() {
    const lista = VESTIDOS.filter(v => filtro === 'Todos' || v.categorias.includes(filtro));
    if (!lista.length) {
      $('grid').innerHTML = `<p class="empty">Novos modelos de ${filtro} em breve.</p>`;
      return;
    }
    $('grid').innerHTML = lista.map(v => `
      <button class="card" data-id="${v.id}">
        <div class="pic">
          <img src="${v.midias.find(m => !isVideo(m))}" alt="${v.nome}" loading="lazy">
          ${v.midias.some(isVideo) ? '<span class="play"></span>' : ''}
        </div>
        <b>${v.nome}</b>
        <small>${v.categorias.join(' · ')}</small>
      </button>`).join('');
    $('grid').querySelectorAll('.card').forEach(c =>
      c.onclick = () => { location.hash = c.dataset.id; });
  }

  // Visualizador
  function abrir(v) {
    $('slides').innerHTML = v.midias.map(m => `<div class="slide">${isVideo(m)
      ? `<video src="${m}" muted loop playsinline preload="metadata"></video>`
      : `<img src="${m}" alt="${v.nome}">`}</div>`).join('');
    $('dots').innerHTML = v.midias.map(() => '<span></span>').join('');
    $('vName').textContent = v.nome;
    $('vInfo').textContent = `Cód. ${v.codigo} · ${v.descricao}`;

    const link = new URL(`v/${v.id}.html`, location.href).href;
    const msg = `Olá! Gostei deste vestido do catálogo:\n*${v.nome}* (cód. ${v.codigo})\n${link}`;
    $('zap').href = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`;

    $('viewer').classList.add('open');
    document.body.style.overflow = 'hidden';
    $('slides').scrollLeft = 0;
    observar();
  }

  function fechar() {
    $('viewer').classList.remove('open');
    document.body.style.overflow = '';
    $('slides').innerHTML = '';
  }

  // toca só o vídeo que está na tela e marca a bolinha
  function observar() {
    const slides = [...$('slides').children];
    const dots = [...$('dots').children];
    const io = new IntersectionObserver(entries => entries.forEach(e => {
      const i = slides.indexOf(e.target);
      const vid = e.target.querySelector('video');
      if (e.isIntersecting) {
        dots.forEach((d, j) => d.classList.toggle('on', j === i));
        vid && vid.play().catch(() => {});
      } else if (vid) vid.pause();
    }), { root: $('slides'), threshold: .6 });
    slides.forEach(s => io.observe(s));
  }

  const passo = dir => $('slides').scrollBy({ left: dir * $('slides').clientWidth, behavior: 'smooth' });
  $('prev').onclick = () => passo(-1);
  $('next').onclick = () => passo(1);
  $('close').onclick = () => history.length > 1 ? history.back() : (location.hash = '');
  addEventListener('keydown', e => {
    if (!$('viewer').classList.contains('open')) return;
    if (e.key === 'Escape') $('close').click();
    if (e.key === 'ArrowLeft') passo(-1);
    if (e.key === 'ArrowRight') passo(1);
  });

  // #id na URL abre o vestido direto (link do WhatsApp cai aqui)
  function rota() {
    const v = VESTIDOS.find(x => x.id === location.hash.slice(1));
    v ? abrir(v) : fechar();
  }
  addEventListener('hashchange', rota);

  renderCats();
  renderGrid();
  rota();
</script>
</body>
</html>
